name: Build

# Push a tag like v0.1.0 to build all three apps and publish them as a GitHub Release.
# "Run workflow" on the Actions tab builds them without a release (download from the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build, package and smoke-test
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: patchy-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Patchy ${GITHUB_REF_NAME#v}" --generate-notes
